name: Firebase App Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to upload (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-distribution-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  distribute:
    if: github.repository == 'aPeterHeise/morgenklar'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: peter-heise-website-2026
      FIREBASE_APP_ID: '1:166111565018:android:e9a8d6ab09ec29a4e581e3'
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Download and verify the published APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          python3 scripts/prepare_firebase_release.py
          --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --output "$RUNNER_TEMP/firebase-release"

      - name: Prepare Firebase CLI
        run: npx -y firebase-tools@latest --version

      - name: Authenticate with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: projects/166111565018/locations/global/workloadIdentityPools/morgenklar-github/providers/github
          service_account: morgenklar-distribution@peter-heise-website-2026.iam.gserviceaccount.com

      - name: Upload and distribute
        env:
          APK_PATH: ${{ steps.release.outputs.apk }}
          NOTES_PATH: ${{ steps.release.outputs.notes }}
          FIREBASE_TESTERS: ${{ vars.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
        shell: bash
        run: |
          args=(appdistribution:distribute "$APK_PATH"
            --app "$FIREBASE_APP_ID" --project "$FIREBASE_PROJECT_ID"
            --release-notes-file "$NOTES_PATH" --non-interactive --json)
          if [[ -n "$FIREBASE_TESTERS" ]]; then args+=(--testers "$FIREBASE_TESTERS"); fi
          if [[ -n "$FIREBASE_GROUPS" ]]; then args+=(--groups "$FIREBASE_GROUPS"); fi
          npx -y firebase-tools@latest "${args[@]}" > "$RUNNER_TEMP/firebase-result.json"

      - name: Summarize distribution
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result_file = Path(os.environ['RUNNER_TEMP']) / 'firebase-result.json'
          if result_file.exists() and result_file.stat().st_size:
              data = json.loads(result_file.read_text())
              if data.get('status') != 'success':
                  raise SystemExit(data.get('error', 'Firebase distribution failed; see upload step.'))
              # firebase-tools currently returns status only, not release metadata.
              summary = f"Uploaded Morgenklar {os.environ['RELEASE_TAG']} to Firebase App Distribution.\n\n"
              summary += '[Open releases in Firebase](https://console.firebase.google.com/project/peter-heise-website-2026/appdistribution/app/android:de.morgenklar.app/releases)\n'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(summary)
          PY
